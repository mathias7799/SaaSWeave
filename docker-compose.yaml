name: saasweave

x-app-env: &app-env
  VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000/server}
  VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-saasweave}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.docker (vp run auth:secret)}
  NODE_ENV: ${NODE_ENV:-production}
  SOURCE_COMMIT: ${SOURCE_COMMIT:-}

x-server-env: &server-env
  <<: *app-env
  ENABLE_OPEN_API_DOCS: ${ENABLE_OPEN_API_DOCS:-false}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CACHE_PREFIX: ${CACHE_PREFIX:-saasweave}
  CACHE_DEFAULT_TTL_SECONDS: ${CACHE_DEFAULT_TTL_SECONDS:-300}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-saasweave}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICES: ${STRIPE_PRICES:-{}}
  STRIPE_METERS: ${STRIPE_METERS:-{}}
  MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
  MAIL_FROM: ${MAIL_FROM:-SaaSWeave <hello@saasweave.io>}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
  MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-minioadmin}
  MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
  MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/uploads}
  MEDIA_UPLOAD_DIR: ${MEDIA_UPLOAD_DIR:-.uploads}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/server/media}
  WORKER_SCHEDULE_INVITATION_CRON: ${WORKER_SCHEDULE_INVITATION_CRON:-0 3 * * *}
  WORKER_SCHEDULE_MRR_SNAPSHOT_CRON: ${WORKER_SCHEDULE_MRR_SNAPSHOT_CRON:-0 2 * * *}
  WORKER_SCHEDULE_STORAGE_CLEANUP_CRON: ${WORKER_SCHEDULE_STORAGE_CLEANUP_CRON:-30 4 * * *}
  WORKER_SCHEDULE_DATA_RETENTION_CRON: ${WORKER_SCHEDULE_DATA_RETENTION_CRON:-0 5 * * *}
  WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9100}
  METRICS_ENABLED: ${METRICS_ENABLED:-false}
  METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
  OTEL_TRACE_SAMPLE_RATE: ${OTEL_TRACE_SAMPLE_RATE:-0.1}
  RETENTION_PURGE_DRY_RUN: ${RETENTION_PURGE_DRY_RUN:-false}
  RETENTION_LEGAL_HOLD_ORG_IDS: ${RETENTION_LEGAL_HOLD_ORG_IDS:-}
  SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
  SECURITY_CSP_REPORT_ONLY: ${SECURITY_CSP_REPORT_ONLY:-false}
  SECURITY_CSP_REPORT_URI: ${SECURITY_CSP_REPORT_URI:-}

services:
  migrate:
    container_name: saasweave-migrate
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrator
    environment:
      <<: *app-env
    networks:
      - saasweave-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    container_name: saasweave-server
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000/server}
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      <<: *server-env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5000$(echo $VITE_SERVER_URL | sed 's|^http[s]*://[^/]*||' | sed 's|/$||')/health/live || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - saasweave-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    container_name: saasweave-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000/server}
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
        VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:-http://localhost:8080}
        VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-insecure}
        VITE_IMGPROXY_SOURCE_WEB_URL: ${VITE_IMGPROXY_SOURCE_WEB_URL:-http://web:3000}
    environment:
      # Web SSR runs the API in-process (in-process oRPC), so it needs the same
      # runtime env as the server — including REDIS_URL (required in production).
      <<: *server-env
      VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:-http://localhost:8080}
      VITE_IMGPROXY_SIGNATURE: ${VITE_IMGPROXY_SIGNATURE:-insecure}
      VITE_IMGPROXY_SOURCE_WEB_URL: ${VITE_IMGPROXY_SOURCE_WEB_URL:-http://web:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000$(echo $VITE_WEB_URL | sed 's|^http[s]*://[^/]*||' | sed 's|/$||')/_api/health/live || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - saasweave-network
    depends_on:
      server:
        condition: service_healthy

  worker:
    container_name: saasweave-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000/server}
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
    environment:
      <<: *server-env
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-9100}:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - saasweave-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: saasweave-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - saasweave-minio-data:/data
    networks:
      - saasweave-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: saasweave-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb -p local/$$MINIO_BUCKET || true;
      mc anonymous set download local/$$MINIO_BUCKET/avatar || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
    networks:
      - saasweave-network
    restart: "no"

  imgproxy:
    image: darthsim/imgproxy:v3.28.0
    container_name: saasweave-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ALLOW_INSECURE: "1"
      # Restrict imgproxy source origins so it cannot be used as an open proxy /
      # SSRF probe. Signing is not usable from a client SPA; allow-list instead.
      IMGPROXY_ALLOWED_SOURCES: "${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/uploads},${VITE_WEB_URL:-http://localhost:3000}/,${VITE_IMGPROXY_SOURCE_WEB_URL:-http://web:3000}/"
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"
    networks:
      - saasweave-network

  postgres:
    image: postgres:18-alpine
    container_name: saasweave-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-saasweave}
    volumes:
      - saasweave-pg-data:/var/lib/postgresql
    networks:
      - saasweave-network
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: saasweave-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - saasweave-redis-data:/data
    networks:
      - saasweave-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in SAML test IdP — does not start with default `docker compose up`.
  # See docs/SSO-TESTING.md for the full runbook.
  sso-idp:
    profiles: ["sso-test"]
    image: kristophjunge/test-saml-idp:1.15
    container_name: saasweave-sso-idp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SSO_IDP_PORT:-8081}:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: ${SSO_TEST_SP_ENTITY_ID:-http://localhost:8081/simplesaml/saml2/idp/metadata.php}
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: ${SSO_TEST_SP_ACS_URL:-http://localhost:5000/server/auth/sso/saml2/sp/acs/local-saml}
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: ${SSO_TEST_SP_SLO_URL:-http://localhost:5000/server/auth/sso/saml2/sp/slo/local-saml}
    networks:
      - saasweave-network

volumes:
  saasweave-pg-data:
  saasweave-redis-data:
  saasweave-minio-data:

networks:
  saasweave-network:
