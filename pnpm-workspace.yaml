overrides:
  # better-auth 1.7.15 accepts kysely 0.28 and 0.29. One 0.29 compiler for every adapter.
  kysely: 0.29.8
  vite: "catalog:"
  # Standalone vite@8 through 8.1.5 is still flagged (launch-editor / fs.allow advisories).
  "vite@>=8.0.0 <8.1.6": "8.3.5"
  # nitro-nightly depends on undici 7. 7.30.1 is the patched release; undici 8 is a breaking major.
  "undici@7": "7.30.1"
  # nitro-nightly depends on srvx ^0.10.1. 0.11 keeps that serve API.
  "srvx@0.10.1": "0.11.22"
  "esbuild@0.28.0": "0.28.2"
  "launch-editor@<=2.14.1": "2.14.2"
  drizzle-orm: "catalog:"
  shell-quote: 1.12.0
  fast-xml-parser: 5.11.2
  brace-expansion: 5.0.12
  # js-yaml 5 changes load(). cosmiconfig and xmlbuilder2 stay on 4.x; 4.3.2 has the merge-key fixes.
  js-yaml: 4.3.2
  # ajv imports fast-uri 3. 3.1.9 has the host-confusion fixes.
  fast-uri: 3.1.9
  postcss: 8.5.32
  # Catalog 2.1.5 includes the serveStatic second-decode fix (GHSA-rmxm-3fg6-px4f).
  "@hono/node-server": "catalog:"
  # files-sdk and the MCP SDK peer an older hono. Catalog 4.13.16 clears the 4.13.x advisories.
  hono: "catalog:"
  # TanStack router-core allows seroval ^1.6.7, which still includes the pre-1.6.8 advisories.
  seroval: 1.7.6
  "@xmldom/xmldom@<=0.8.14": 0.8.15
  ip-address: 10.7.6
  "qs@6": 6.17.1
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  "proxy-addr@<2.0.8": 2.0.8
  "nanoid@>=3.0.0 <3.3.18": 3.3.20
  browserslist: 4.29.5
  baseline-browser-mapping: 2.11.35
  decode-uri-component: 0.5.1
  "socket.io-parser@<4.2.7": 4.2.7
  "engine.io@>=6.0.0 <6.6.11": 6.6.11
  "source-map-js@<1.2.2": 1.2.2
  "minimatch@<11.0.1": 11.0.4
  "glob@>=9.0.0 <=14.0.1": 14.0.3
  tinypool: 2.2.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
