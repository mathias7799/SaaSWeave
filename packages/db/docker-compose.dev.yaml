name: saasweave-db-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: saasweave-db-dev-postgres
    environment:
      POSTGRES_DB: saasweave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - saasweave-db-dev-postgres-dev:/var/lib/postgresql

volumes:
  saasweave-db-dev-postgres-dev:
