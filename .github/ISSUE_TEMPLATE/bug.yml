name: Bug report
description: Report reproducible behavior that is incorrect or unexpected
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, personal data, or vulnerability details. Use the private process in SECURITY.md for security reports.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence, repository, or failing test.
      placeholder: |
        1. Start ...
        2. Configure ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or version, OS, Node/pnpm versions, browser, deployment mode, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add sanitized logs, stack traces, screenshots, or recordings when useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed secrets, credentials, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
