name: Docs site

# Builds the VitePress documentation site in website/ and publishes the static
# output to the `gh-pages` branch. This targets GitHub Pages in "Deploy from a
# branch" mode (Settings -> Pages -> Source: "Deploy from a branch", Branch:
# gh-pages, Folder: / (root)).
#
# It runs on push to the docs branch (so you can deploy without merging first)
# and to main, plus manual dispatch. The site is isolated from the pnpm
# workspace and is installed with npm.

on:
  push:
    branches: [main, Saasweave-docs]
    paths:
      - 'website/**'
      - 'docs/media/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/.vitepress/dist
          publish_branch: gh-pages
          # Keep gh-pages as a single fresh commit instead of accumulating history.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: deploy site'
