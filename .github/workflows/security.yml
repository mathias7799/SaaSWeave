name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: false
      - name: Upload CodeQL results
        uses: actions/upload-artifact@v5
        with:
          name: codeql-results
          path: codeql-results
          retention-days: 14

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lockfile dedupe check
        run: |
          pnpm dedupe --check
          echo "Lockfile dedupe check passed."

      - name: Production dependency audit
        run: |
          set +e
          pnpm audit --prod --json > /tmp/audit.json
          set -e
          node scripts/ci/audit-allowlist-check.mjs /tmp/audit.json

      - name: Framework exception expiry gate
        run: node scripts/ci/framework-exceptions-check.mjs

      - name: License gate
        run: node scripts/ci/license-gate.mjs

      - name: Generate SBOM (CycloneDX)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm@6.0.0 \
            --omit dev \
            --output-file sbom.cdx.json \
            --spec-version 1.5
          test -s sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      - name: Generate NOTICE
        run: |
          node scripts/ci/generate-notice.mjs
          git diff --exit-code -- NOTICE

  container-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: [server, web, worker]
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            -f apps/${{ matrix.app }}/Dockerfile \
            --target production \
            -t saasweave-${{ matrix.app }}:ci \
            --build-arg SOURCE_COMMIT=${{ github.sha }} \
            --build-arg VITE_SERVER_URL=http://localhost:5000/server \
            --build-arg VITE_WEB_URL=http://localhost:3000 \
            .

      - name: Image secret scan
        run: node scripts/ci/docker-image-secret-scan.mjs saasweave-${{ matrix.app }}:ci

      - name: Trivy image scan (HIGH/CRITICAL blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: saasweave-${{ matrix.app }}:ci
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: false
